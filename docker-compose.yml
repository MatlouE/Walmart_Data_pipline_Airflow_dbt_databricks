version: '3.8'

services:
  # Source PostgreSQL DB (Replaces Ghost)
  walmart-source-db:
    image: postgres:15
    container_name: walmart_source_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: walmart_db
    ports:
      - "5433:5432"
    volumes:
      - walmart_source_data:/var/lib/postgresql/data
      - ./walmart_dataset:/walmart_dataset

  # Airflow Metadata DB
  postgres-airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.8.1-python3.10
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=46ExTH231936166164213038634125828456184=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_walmart:/opt/airflow/dbt_walmart
    depends_on:
      - postgres-airflow
      - walmart-source-db
    entrypoint: >
      /bin/bash -c "
      airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true;
      airflow webserver"

  # Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.8.1-python3.10
    container_name: airflow_scheduler
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__FERNET_KEY=46ExTH231936166164213038634125828456184=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt_walmart:/opt/airflow/dbt_walmart
    depends_on:
      - postgres-airflow
      - walmart-source-db

volumes:
  walmart_source_data:
  airflow_postgres_data: